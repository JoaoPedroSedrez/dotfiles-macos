# ~/.config/mise/config.toml — managed by ~/dotfiles (configs/mise/config.toml)
# Global runtime versions. Per-project overrides go in that project's own
# .mise.toml / .tool-versions, not here.

[tools]
java = "temurin-17"
node = "lts"
php = "8.3"
pnpm = "latest"
python = "latest"

[settings]
# The 3s default is too short on slow networks: php's version list (a git
# clone of the vfox plugin + remote lookup) times out, and every shim call
# then prints a warning and stalls.
fetch_remote_versions_timeout = "30s"
